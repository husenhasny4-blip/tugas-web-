<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <table align="center">
         <tr>
             <td>Username</td>
             <td><input type="text" name="txtuser" id="" placeholder="isikan dengan benar"
                pattern="[A-Za-a]+"></td>
            </tr>
         <tr>
             <td>Password</td>
             <td><input type="password" name="txtpass" id="" placeholder="minimal 6 karakter"
                pattern="[A-Za-z0-9]+{6,15}"></td>
            </tr>
        <tr>
            <td>Umur</td>
            <td><input type="number" name="txtumur" id="" min="18" max="100"></td>
        </tr>
        <tr>
            <td>Jenis kelamin</td>
            <td><input type="radio" name="jkel" id="" checked value="p">pria
                <input type="radio" name="jkel" id="" value="w" >wanita</td>           
        </tr>
        <tr>
            <td>Alamat</td>
            <td><textarea name="txtalm" id="" rows="4" cols="30"></textarea></td>
        </tr>
        <tr>
            <td>Tanggal Lahir</td>
            <td><input type="date" name="txttgl" id=""></td>
        </tr>
        <tr>
            <td>Jurusan</td>
            <td><select name="txtjur" id="">
                <optgroup label="FTD">
                    <option value="TI">Teknik Informatika</option>
                    <option value="SK">Sistem Komputer</option>
                    <option value="DKV">Desain Komunikasi Visual</option>
                </optgroup>
                <optgroup label="FEB">
                    <option value="AK">Akuntansi</option>
                    <option value="MAN">Manajemen</option>
                </optgroup>
            </select></td>
        </tr>
        
         <tr>
             <td></td>
             <td><input type="submit" value="kirim"><input type="reset" value="batal"></td>
            </tr>


        </table>

    </form>
</body>
</html>
